<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Special One and only person ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hearts-container"></div>

    <div class="container entrance-card">
        <div class="heart-icon">🔒❤️</div>
        <h1>For My Princess Only</h1>
        <p class="subtitle">Ye jagah sirf aapke liye bani hai... Enter passcode to Unlock</p>

        <div class="passcode-box">
            <input type="password" id="passcode" class="game-input" placeholder="Passcode (jaya / 222003)" autofocus>
            <button class="btn btn-sm" onclick="checkPasscode()">Unlock My Heart 🔑</button>
        </div>
        <p id="pass-err" class="error-text"></p>
    </div>

    <script>
        function checkPasscode() {
            const pass = document.getElementById('passcode').value.trim().toLowerCase();
            
            // Strict password logic: Sirf '222003' ya 'jaya' par hi enter hone dega
            if (pass === "222003" || pass === "jaya") {
                window.location.href = "letter.html";
            } else {
                document.getElementById('pass-err').innerText = "Incorrect Password! Try 'jaya' or '222003' 😉";
            }
        }

        // Enter key press support
        document.getElementById('passcode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPasscode();
            }
        });

        function createHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
